name: Hetzner Ephemeral Runner Deployment with Caddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Hetzner server
        run: |
          # 1. Prepare the local SSH environment inside the runner
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 2. Write the private key into a secure temporary file
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # 3. Connect and execute commands using the native OpenSSH client
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.HETZNER_USERNAME }}@${{ secrets.HETZNER_HOST }} << 'EOF'
            cd ${{ secrets.PROJECT_PATH }}
            git pull origin main
            docker-compose down
            docker-compose up -d
            echo "Deployment completed successfully"
          EOF
