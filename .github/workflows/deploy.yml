name: Hetzner Ephemeral Runner Deployment with Caddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Hetzner server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USERNAME }}
        run: |
          # 1. Prepare local SSH environment
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 2. Write private key
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # 3. Clean up variables
          CLEAN_HOST=$(echo "$SSH_HOST" | tr -d '\r\n ')
          CLEAN_USER=$(echo "$SSH_USER" | tr -d '\r\n ')
          
          # 4. Connect using Native SSH on a single, clean line execution block
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa "${CLEAN_USER}@${CLEAN_HOST}" << 'EOF'
            cd ${{ secrets.PROJECT_PATH }}
            git pull origin main
            docker-compose down
            docker-compose up -d
            echo "Deployment completed successfully"
          EOF
