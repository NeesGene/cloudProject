name: Hetzner Ephemeral Runner Deployment with Caddy

on:
  push:
    branches:
      - main

jobs:
  # PHASE 1: Spin up the ephemeral runner
  start-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-hcloud-runner.outputs.label }}
    steps:
      - name: Create Hetzner Cloud Server
        id: start-hcloud-runner
        uses: cyclenerd/cloud-tools-container:latest
        with:
          mode: start
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_type: cx22

  # PHASE 2: Run build tasks safely inside the fresh runner
  build-and-deploy:
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log into GitHub Packages Registry securely
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build your Dockerfile inside the fresh machine and push it to GHCR
      - name: Build and Push Webapp Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/neesgene/cloudproject:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SSH into your live production server to tell Caddy to update
      - name: Update Live Hetzner Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/cloudProject
            git pull origin main
            docker compose pull webapp
            docker compose up -d --remove-orphans

  # PHASE 3: Kill the temporary runner so you aren't billed for it
  stop-runner:
    runs-on: ubuntu-latest
    needs: [start-runner, build-and-deploy]
    if: always()
    steps:
      - name: Destroy Hetzner Cloud Server
        uses: cyclenerd/cloud-tools-container:latest
        with:
          mode: stop
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          label: ${{ needs.start-runner.outputs.label }}
