name: Hetzner Ephemeral Runner Deployment with Caddy

on:
  push:
    branches:
      - main

jobs:
  # PHASE 1: Spin up the ephemeral runner
  start-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-hcloud-runner.outputs.label }}
    steps:
      - name: Create Hetzner Cloud Server
        id: start-hcloud-runner
        uses: cyclenerd/cloud-tools-container@55af8e082599558df9192443081f444fd82815b2
        with:
          mode: start
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_type: cx22

  # PHASE 2: Run build tasks safely inside the fresh runner
  build-and-deploy:
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log into GitHub Packages Registry securely
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build your Dockerfile inside the fresh machine and push it to GHCR
      - name: Build and Push Webapp Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/neesgene/cloudproject:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SSH into your live production server to tell Caddy to update
      - name: Update Live Hetzner Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "Starting deployment..."
            
            # Verify we're in the right directory
            cd ~/cloudProject || { echo "Failed to cd into ~/cloudProject"; exit 1; }
            echo "✓ In directory: $(pwd)"
            
            # Pull latest code
            echo "Pulling latest code from main..."
            git pull origin main || { echo "Git pull failed"; exit 1; }
            echo "✓ Git pull successful"
            
            # Log in to container registry on production server
            echo "Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || { echo "Docker login failed"; exit 1; }
            echo "✓ GHCR login successful"
            
            # Force pull the latest image
            echo "Pulling latest webapp image from GHCR..."
            docker compose pull webapp || { echo "Docker pull failed"; exit 1; }
            echo "✓ Image pull successful"
            
            # Start/restart containers
            echo "Deploying containers..."
            docker compose up -d --remove-orphans || { echo "Docker compose up failed"; exit 1; }
            echo "✓ Containers deployed"
            
            # Verify deployment
            echo "Verifying deployment..."
            docker compose ps
            echo "✓ Deployment verification complete"
            
            # Show recent logs
            echo "Recent container logs:"
            docker compose logs --tail=20 webapp || true

  # PHASE 3: Kill the temporary runner so you aren't billed for it
  stop-runner:
    runs-on: ubuntu-latest
    needs: [start-runner, build-and-deploy]
    if: always()
    steps:
      - name: Destroy Hetzner Cloud Server
        uses: cyclenerd/cloud-tools-container@55af8e082599558df9192443081f444fd82815b2
        with:
          mode: stop
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          label: ${{ needs.start-runner.outputs.label }}
