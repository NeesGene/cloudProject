services:
  webapp:
    image: ghcr.io/neesgene/cloudproject:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "3000:3000"
    labels:
      caddy: "genenees.duckdns.org"
      caddy.reverse_proxy: "{{upstreams}}"
    networks:
      - caddy_net

  caddy:
    image: lucaslorentz/caddy-docker-proxy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_INGRESS_NETWORKS=caddy_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    networks:
      - caddy_net

networks:
  caddy_net:
    name: caddy_net

volumes:
  caddy_data:
