version: '3.8'

services:
  webapp:
    # Change username and repository-name to your actual GitHub info (lowercase!)
    image: ghcr.io/your-github-username/your-repository-name:latest
    restart: always
    labels:
      caddy: "genenees.duckdns.org"
      caddy.reverse_proxy: "{{upstreams 3000}}"
    networks:
      - caddy_net

  caddy:
    image: lucaslorentz/caddy-docker-proxy:latest
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    networks:
      - caddy_net

networks:
  caddy_net:

volumes:
  caddy_data: